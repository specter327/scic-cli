[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scic-cli"
version = "0.1.1"
description = "Ready-to-use interactive shell client for SCIC Framework applications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Specter" }]
requires-python = ">=3.10"
dependencies = [
    "scic-framework",
    "prompt-toolkit>=3.0.43,<4.0.0",
    "rich>=13.7,<15.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
build = [
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/specter327/scic-cli"
Repository = "https://github.com/specter327/scic-cli"
Issues = "https://github.com/specter327/scic-cli/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["scic_cli*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["scic_cli"]
